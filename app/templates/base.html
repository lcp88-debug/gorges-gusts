<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>Gorges Gusts</title>
  <style>
    :root { color-scheme: light dark; --accent: #fc5200; --muted: #71717a; --line: #e4e4e7; }
    @media (prefers-color-scheme: dark) { :root { --line: #3f3f46; --muted: #a1a1aa; } }
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 72rem; padding: 1.5rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    a { color: var(--accent); }
    button, .button { background: var(--accent); border: 0; border-radius: .4rem; color: #fff; cursor: pointer;
      display: inline-block; font: inherit; padding: .5rem 1rem; text-decoration: none; }
    button:disabled { cursor: default; opacity: .45; }
    button.quiet { background: none; border: 1px solid var(--line); color: inherit; }
    .actions { display: flex; gap: .5rem; }
    .muted { color: var(--muted); font-size: .875rem; }
    .notice { border: 1px solid var(--line); border-radius: .4rem; margin-bottom: 1.5rem; padding: .75rem 1rem; }
    .notice.error { border-color: #dc2626; }
    progress { display: block; margin-top: .5rem; width: 100%; }
    nav.tabs { border-bottom: 1px solid var(--line); display: flex; gap: 1.5rem; margin-bottom: 1rem; }
    nav.tabs a { color: inherit; padding: .5rem 0; text-decoration: none; }
    nav.tabs a[aria-current] { border-bottom: 2px solid var(--accent); font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid var(--line); padding: .6rem .75rem; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; white-space: normal; }
    th { font-size: .8125rem; font-weight: 600; vertical-align: bottom; white-space: normal; }
    td { font-variant-numeric: tabular-nums; }
    th a[aria-current] { font-weight: 700; text-decoration-thickness: 2px; }
    summary { cursor: pointer; }
    table.hours td { border: 0; padding: .1rem .5rem; }
    table.hours td:first-child { text-align: left; white-space: nowrap; }
    .profile { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem; margin: .5rem 0; }
    .profile label { display: flex; flex-direction: column; }
    .profile input { font: inherit; padding: .3rem .5rem; width: 8rem; }
    .credits { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Gorges Gusts</h1>
    {% block actions %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</body>
</html>
